# n8n Assistant sandbox (self-hosted, development use only).
#
# n8n's built-in Assistant runs AI-generated code in a sandbox. This stack is
# the self-hosted sandbox service it expects ("Service URL" + "API key"):
#
#   tls-init          one-shot: generates the mTLS material the API and the
#                     runner use for their private gRPC channels
#   sandbox-api       control plane. n8n talks to it over plain HTTP :8080
#                     with a bearer key (SANDBOX_API_KEYS)
#   sandbox-runner-1  privileged Docker-in-Docker. Spawns one throwaway
#                     container per sandbox execution.
#
# Separate compose project ("n8n-sandbox") from ../docker-compose.yml, joined
# only by the external docker network `n8n-sandbox`:
#
#   docker network create n8n-sandbox        # once, idempotent guard below
#   cp .env.example .env                     # then fill in the three secrets
#   docker compose up -d
#
# n8n reaches the API as http://sandbox-api:8080 - 127.0.0.1 and the host LAN
# IP do not work from inside the n8n container.
#
# SECURITY: sandbox-runner-1 is privileged and root-equivalent on this host.
# Its sandbox image runs arbitrary code produced by a model. Keep both stacks
# on a trusted LAN / private host and never publish 8080 or 9090.
#
# Pinned versions: API, runner and sandbox images ship as one release and are
# only supported together, so all three use 1.16.0 (verified: the `stable`
# tags of ghcr.io/n8n-io/n8n-sandbox-service-{api,runner-dind,sandbox} all
# resolve to the same digest as 1.16.0). Bump all three at once.

name: n8n-sandbox

services:
  tls-init:
    image: ghcr.io/n8n-io/n8n-sandbox-service-api:1.16.0
    # Runs as root only to create ./tls and the private keys in it.
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command:
      - >-
        bootstrap-mtls.sh
        --out-dir /tls
        --api-san sandbox-api
        --control-san-prefix sandbox-runner
        --world-readable
    environment:
      NUM_RUNNERS: "${NUM_RUNNERS:-1}"
    volumes:
      # Bind mount, not a named volume: the certs stay visible next to this
      # file and travel with a backup of infra/n8n. Git-ignored (see ../.gitignore).
      - ./tls:/tls
    restart: "no"
    # Needs no network at all: it only writes PEMs into the shared volume.
    network_mode: "none"
    # Idempotent: the script exits 0 without regenerating if the PEM set exists.
    # Force a full regeneration with: SANDBOX_TLS_REGEN=1 docker compose run --rm tls-init

  sandbox-api:
    image: ghcr.io/n8n-io/n8n-sandbox-service-api:1.16.0
    restart: unless-stopped
    depends_on:
      tls-init:
        condition: service_completed_successfully
    ports:
      # Host-local only, purely so `curl http://127.0.0.1:3200/healthz` works
      # from this machine. n8n itself uses the docker network, not this port.
      - "127.0.0.1:3200:8080"
    environment:
      # --- n8n -> API auth (comma separated list; the first one goes into the
      # Assistant wizard as the API key) ---
      SANDBOX_API_KEYS: ${SANDBOX_API_KEYS:?SANDBOX_API_KEYS is required, see .env.example}
      # --- runner registration (must match the runner's copies below) ---
      SANDBOX_API_RUNNER_REGISTRATION_TOKEN: ${SANDBOX_API_RUNNER_REGISTRATION_TOKEN:?SANDBOX_API_RUNNER_REGISTRATION_TOKEN is required, see .env.example}
      SANDBOX_API_RUNNER_API_KEY: ${SANDBOX_API_RUNNER_API_KEY:?SANDBOX_API_RUNNER_API_KEY is required, see .env.example}
      # --- mTLS ---
      SANDBOX_API_GRPC_TLS_CERT_FILE: /tls/api/grpc-server.crt
      SANDBOX_API_GRPC_TLS_KEY_FILE: /tls/api/grpc-server.key
      SANDBOX_API_GRPC_TLS_CLIENT_CA_FILE: /tls/api/ca.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CA_FILE: /tls/api/ca.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CERT_FILE: /tls/api/control-grpc-api-client.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_KEY_FILE: /tls/api/control-grpc-api-client.key
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_SERVER_NAME: sandbox-runner-1
      # --- runtime ---
      SANDBOX_API_LOG_LEVEL: ${SANDBOX_API_LOG_LEVEL:-info}
    volumes:
      - ./tls:/tls:ro
      # Sandbox bookkeeping (sqlite by default). Disposable: losing it only
      # forgets which sandboxes used to exist.
      - sandbox-api-data:/var/lib/n8n-sandbox-api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    networks:
      sandbox:
        # The name n8n uses: http://sandbox-api:8080
        aliases:
          - sandbox-api

  sandbox-runner-1:
    image: ghcr.io/n8n-io/n8n-sandbox-service-runner-dind:1.16.0
    # Root-equivalent on this host by design: it runs its own dockerd.
    privileged: true
    restart: unless-stopped
    # The runner drains requests (up to 40 s) and removes sandboxes (up to
    # 30 s) before dockerd stops (up to 15 s); compose's 10 s default cuts
    # that short and leaves orphan containers.
    stop_grace_period: 90s
    depends_on:
      sandbox-api:
        condition: service_healthy
    environment:
      SANDBOX_RUNNER_ID: runner-1
      # Registration (gRPC, mTLS) + control channel back to the API.
      SANDBOX_RUNNER_API_GRPC_ADDR: sandbox-api:9090
      SANDBOX_RUNNER_REGISTRATION_TOKEN: ${SANDBOX_RUNNER_REGISTRATION_TOKEN:?SANDBOX_RUNNER_REGISTRATION_TOKEN is required, see .env.example}
      SANDBOX_RUNNER_API_KEYS: ${SANDBOX_RUNNER_API_KEYS:?SANDBOX_RUNNER_API_KEYS is required, see .env.example}
      # Must be reachable from the API: the docker network alias below.
      SANDBOX_RUNNER_HTTP_BASE_URL: https://sandbox-runner-1:8080
      SANDBOX_RUNNER_CONTROL_GRPC_LISTEN_ADDR: ":9091"
      SANDBOX_RUNNER_CONTROL_GRPC_ADVERTISE_ADDR: sandbox-runner-1:9091
      # Image each sandbox container is created from. Pulled by the runner's
      # inner dockerd on first execution (see README).
      SANDBOX_RUNNER_DOCKER_SANDBOX_IMAGE: ghcr.io/n8n-io/n8n-sandbox-service-sandbox:1.16.0
      SANDBOX_RUNNER_REGISTRATION_GRPC_CA_FILE: /tls/runner/ca.crt
      SANDBOX_RUNNER_REGISTRATION_GRPC_CERT_FILE: /tls/runner/grpc-client.crt
      SANDBOX_RUNNER_REGISTRATION_GRPC_KEY_FILE: /tls/runner/grpc-client.key
      SANDBOX_RUNNER_REGISTRATION_GRPC_SERVER_NAME: sandbox-api
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_CERT_FILE: /tls/runner/control-grpc-server.crt
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_KEY_FILE: /tls/runner/control-grpc-server.key
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_CLIENT_CA_FILE: /tls/runner/ca.crt
      SANDBOX_RUNNER_LOG_LEVEL: ${SANDBOX_RUNNER_LOG_LEVEL:-info}
    volumes:
      - ./tls:/tls:ro
    healthcheck:
      test:
        ["CMD", "wget", "-q", "-O", "/dev/null", "--no-check-certificate", "https://127.0.0.1:8080/readyz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      sandbox:
        aliases:
          - sandbox-runner-1
    deploy:
      resources:
        limits:
          # DinD needs headroom: each sandbox is a full container.
          cpus: "2.0"
          memory: 3g

volumes:
  sandbox-api-data:

networks:
  sandbox:
    external: true
    name: n8n-sandbox
